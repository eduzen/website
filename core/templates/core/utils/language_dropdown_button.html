{% load i18n %}
<div class="relative inline-block" x-data="{
  open: false,
  switchLanguage(languageCode) {
    const { pathname, search, hash } = window.location;
    const localePrefix = /^\/(en|es)(\/|$)/;
    let nextPath = pathname;

    if (localePrefix.test(pathname)) {
      nextPath = pathname.replace(localePrefix, `/${languageCode}$2`);
      if (nextPath === `/${languageCode}`) {
        nextPath = `/${languageCode}/`;
      }
    } else if (pathname === '/') {
      nextPath = `/${languageCode}/`;
    } else {
      nextPath = `/${languageCode}${pathname}`;
    }

    window.location.assign(`${nextPath}${search}${hash}`);
  }
}">
  <button @click="open = !open" class="language-button" type="button" :aria-expanded="open ? 'true' : 'false'" aria-haspopup="menu">
    {% if LANGUAGE_CODE == "es" %}
      <span class="fi fi-es"></span>
    {% else %}
      <span class="fi fi-gb"></span>
    {% endif %}
  </button>
  <div x-show="open" x-cloak x-transition.opacity.duration.150ms @click.outside="open = false"
       data-testid="language-dropdown"
       role="menu"
       class="absolute right-0 z-20 mt-2 py-2 w-48 rounded shadow-lg"
       style="background: var(--bg); border: 1px solid rgba(0,0,0,0.06);">
    <a href="/en/"
       @click.prevent="switchLanguage('en')"
       role="menuitem"
       class="block px-4 py-2 text-sm capitalize nav-link">
      <span class="fi fi-gb"></span>
      {% translate "English" %}
    </a>
    <a href="/es/"
       @click.prevent="switchLanguage('es')"
       role="menuitem"
       class="block px-4 py-2 text-sm capitalize nav-link">
      <span class="fi fi-es"></span>
      {% translate "Spanish" %}
    </a>
  </div>
</div>
